services:
  randimg:
    image: ghcr.io/ltba/randimg:latest
    container_name: randimg
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - GIN_MODE=release
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "./randimg", "-healthcheck"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
